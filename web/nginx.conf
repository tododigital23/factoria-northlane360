server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }
    location /assets/ { try_files $uri =404; }
    location /freddy-3d/ { try_files $uri =404; }
    location /freddy-views/ { try_files $uri =404; }
    location = /freddy-reference.png { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
