name: Eliot document credential preflight
on:
  pull_request:
    paths:
      - "app/eliot_document_analysis.py"
      - "tests/test_document_secret_preflight.py"
      - ".github/workflows/document-secret-preflight.yml"
jobs:
  protect-documents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements.txt
      - name: Verify sensitive credentials never sent to model
        run: python -m pytest -q tests/test_document_secret_preflight.py tests/test_eliot_document_analysis.py tests/test_document_analysis_http.py tests/test_runtime_budget_view.py
