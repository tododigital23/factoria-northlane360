name: ELIOT tool control API
on:
  pull_request:
    paths:
      - 'app/eliot_tool_control_api.py'
      - 'app/eliot_tool_grant_policy.py'
      - 'app/main.py'
      - 'tests/test_tool_control_http.py'
      - '.github/workflows/tool-control-031.yml'
jobs:
  http-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q tests/test_tool_control_http.py tests/test_tool_grant_policy.py tests/test_tenant_github_readonly.py tests/test_organizations_api.py tests/test_document_analysis_http.py tests/test_analysis_run_http.py tests/test_organizations_activation.py
