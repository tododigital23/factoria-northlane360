name: ELIOT company work overview security
on:
  pull_request:
    paths:
      - "app/eliot_work_overview.py"
      - "app/organizations_api.py"
      - "tests/test_eliot_work_overview.py"
      - ".github/workflows/company-work-overview.yml"
jobs:
  owner-only-work-overview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements.txt
      - name: Auth0 owner isolation, bounded audit, no report text leakage
        run: python -m pytest -q tests/test_eliot_work_overview.py tests/test_document_analysis_http.py tests/test_analysis_run_http.py tests/test_task_document_preflight.py
