name: PostgreSQL 18 company activity
on:
  pull_request:
    paths:
      - "db/eliot/013_company_activity.sql"
      - "tests/sql/company_activity_acceptance.sql"
      - ".github/workflows/company-activity-pg18.yml"
jobs:
  verify-activity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env: {POSTGRES_PASSWORD: ci_only, POSTGRES_DB: eliot_dev}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d eliot_dev"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env: {PGHOST: localhost, PGPORT: "5432", PGUSER: postgres, PGPASSWORD: ci_only, PGDATABASE: eliot_dev}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: feature/tenant-tasks-events-foundation
          path: schema
      - name: Install isolated PostgreSQL schema
        run: |
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE eliot_migrator NOLOGIN; CREATE ROLE eliot_identity NOLOGIN; CREATE SCHEMA eliot AUTHORIZATION eliot_migrator;"
          (echo 'SET ROLE eliot_migrator;'; cat schema/db/eliot/001_core_identity.sql; cat schema/db/eliot/003_departments.sql; cat schema/db/eliot/005_ai_workers.sql; cat schema/db/eliot/008_tasks_events.sql) | psql -v ON_ERROR_STOP=1
      - name: Install activity function
        run: psql -v ON_ERROR_STOP=1 -f db/eliot/013_company_activity.sql
      - name: Verify active membership and tenant isolation
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/company_activity_acceptance.sql
