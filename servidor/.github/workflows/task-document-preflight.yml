name: Task document SHA preflight security
on:
  pull_request:
    paths:
      - "app/organizations_api.py"
      - "app/eliot_github_reader.py"
      - "tests/test_task_document_preflight.py"
      - ".github/workflows/task-document-preflight.yml"
jobs:
  no-model-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements.txt
      - name: Prove owner tenant, task, worker, SHA and no-model contract
        run: python -m pytest -q tests/test_task_document_preflight.py tests/test_tenant_github_readonly.py tests/test_organizations_api.py
