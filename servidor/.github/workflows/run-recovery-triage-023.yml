name: Eliot interrupted run triage safety
on:
  pull_request:
    paths:
      - "app/eliot_run_recovery_triage.py"
      - "app/organizations_api.py"
      - "tests/test_run_recovery_triage.py"
      - ".github/workflows/run-recovery-triage-023.yml"
jobs:
  triage-read-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements.txt
      - name: Prove no retry or cross-company disclosure
        run: python -m pytest -q tests/test_run_recovery_triage.py tests/test_eliot_work_overview.py tests/test_analysis_run_http.py tests/test_document_analysis_http.py
