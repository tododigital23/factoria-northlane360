name: Authenticated organizations API tests
on:
  pull_request:
    paths:
      - "app/organizations_api.py"
      - "tests/test_organizations_api.py"
      - "requirements.txt"
      - ".github/workflows/organizations-api-tests.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q tests/test_api.py tests/test_organizations_api.py tests/test_organizations_activation.py tests/test_auth0_jwt_crypto.py tests/test_organizations_http_flow.py
