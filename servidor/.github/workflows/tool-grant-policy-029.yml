name: ELIOT scoped GitHub tool policy
on:
  pull_request:
    paths:
      - "app/eliot_tool_grant_policy.py"
      - "tests/test_tool_grant_policy.py"
      - ".github/workflows/tool-grant-policy-029.yml"
jobs:
  no-github-writes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q tests/test_tool_grant_policy.py tests/test_execution_readiness.py
