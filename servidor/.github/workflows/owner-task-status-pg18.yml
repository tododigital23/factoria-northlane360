name: PostgreSQL 18 owner task status
on:
  pull_request:
    paths:
      - "db/eliot/012_owner_task_status.sql"
      - "tests/sql/task_state_transitions_acceptance.sql"
      - ".github/workflows/owner-task-status-pg18.yml"
jobs:
  transactional-status:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env: {POSTGRES_PASSWORD: ci_only, POSTGRES_DB: eliot_dev}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d eliot_dev"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env: {PGHOST: localhost, PGPORT: "5432", PGUSER: postgres, PGPASSWORD: ci_only, PGDATABASE: eliot_dev}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: feature/tenant-tasks-events-foundation
          path: schema
      - uses: actions/checkout@v4
        with:
          ref: feature/authorized-task-create
          path: write
      - uses: actions/checkout@v4
        with:
          ref: feature/task-event-read
          path: history
      - name: Install schema, creator, history, and status workflow
        run: |
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE eliot_migrator NOLOGIN; CREATE ROLE eliot_identity NOLOGIN; CREATE SCHEMA eliot AUTHORIZATION eliot_migrator;"
          (echo 'SET ROLE eliot_migrator;'; cat schema/db/eliot/001_core_identity.sql; cat schema/db/eliot/003_departments.sql; cat schema/db/eliot/005_ai_workers.sql; cat schema/db/eliot/008_tasks_events.sql) | psql -v ON_ERROR_STOP=1
          psql -v ON_ERROR_STOP=1 -f write/db/eliot/010_owner_create_task.sql
          psql -v ON_ERROR_STOP=1 -f history/db/eliot/011_task_event_reader.sql
          psql -v ON_ERROR_STOP=1 -f db/eliot/012_owner_task_status.sql
      - name: Verify owner permissions, audit and transitions
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/task_state_transitions_acceptance.sql
