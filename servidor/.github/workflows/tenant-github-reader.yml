name: Tenant-scoped GitHub App document reader
on:
  pull_request:
    paths:
      - "app/eliot_github_reader.py"
      - "app/organizations_api.py"
      - "tests/test_tenant_github_readonly.py"
      - ".github/workflows/tenant-github-reader.yml"
jobs:
  read-only-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements.txt
      - name: Verify tenant scope, GitHub App credential isolation and path restrictions
        run: python -m pytest -q tests/test_tenant_github_readonly.py tests/test_organizations_api.py tests/test_analysis_run_http.py
