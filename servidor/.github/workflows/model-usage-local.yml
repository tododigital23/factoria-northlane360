name: Eliot local model usage owner-only
on:
  pull_request:
    paths:
      - "app/eliot_runtime_budget_view.py"
      - "app/organizations_api.py"
      - "tests/test_runtime_budget_view.py"
      - ".github/workflows/model-usage-local.yml"
jobs:
  local-usage-acl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements.txt
      - name: Verify tenant visibility, truthful metering, regression protections
        run: python -m pytest -q tests/test_runtime_budget_view.py tests/test_eliot_model_limits.py tests/test_eliot_work_overview.py tests/test_document_analysis_http.py
