# Nginx en el VPS sin Docker: web estática + proxy al API local.
# Ajusta root y server_name. Escucha en 80; pon TLS con certbot delante o en este mismo server.
server {
    listen 80;
    server_name app.tu-dominio.com;
    root /opt/factoria/web/dist;
    index index.html;
    client_max_body_size 8m;

    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        access_log off;
    }
    location /v1/ {
        proxy_pass http://127.0.0.1:8000/v1/;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 120s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
