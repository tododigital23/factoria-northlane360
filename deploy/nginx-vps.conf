# Un solo origen: la web estática y el API en el mismo dominio del VPS.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 8m;

    location = /health {
        proxy_pass http://api:8000/health;
        proxy_set_header Host $host;
        access_log off;
    }

    resolver 127.0.0.11 ipv6=off valid=10s;
    location /v1/ {
        proxy_pass http://api:8000/v1/;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type $content_type;
        proxy_read_timeout 120s;
    }

    location /demo/ {
        proxy_pass http://api:8000/demo/;
        proxy_set_header Host $host;
        proxy_set_header X-Demo-Key $http_x_demo_key;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }
    location /assets/ { try_files $uri =404; }
    location /freddy-3d/ { try_files $uri =404; }
    location /freddy-views/ { try_files $uri =404; }
    location = /freddy-reference.png { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
