# La Factoría en un VPS: Postgres + API + web (mismo dominio).
# Copia deploy/env.vps.example a .env, rellena y ejecuta: docker compose up -d --build
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${ELIOT_DB_NAME:-eliot_dev}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?pon POSTGRES_PASSWORD en .env}
      ELIOT_IDENTITY_DB_PASSWORD: ${ELIOT_IDENTITY_DB_PASSWORD:?pon la clave de eliot_identity_app}
      ELIOT_WORKER_DB_PASSWORD: ${ELIOT_WORKER_DB_PASSWORD:-}
    volumes:
      - factoria_pg:/var/lib/postgresql/data
      - ./deploy/postgres/init.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${ELIOT_DB_NAME:-eliot_dev}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: ./servidor
      dockerfile: Dockerfile
    command: ["python", "ops/install_schema.py"]
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/${ELIOT_DB_NAME:-eliot_dev}
      ELIOT_DB_ENGINE: postgresql
      ELIOT_BOOTSTRAP_SUBJECT: ${ELIOT_BOOTSTRAP_SUBJECT:-}
      ELIOT_HOLDING_NAME: ${ELIOT_HOLDING_NAME:-Superempresa Freddy}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./servidor
      dockerfile: Dockerfile
    environment:
      ELIOT_ENABLE_ORGANIZATIONS_API: "true"
      ELIOT_DB_ENGINE: postgresql
      DATABASE_URL: postgresql://eliot_identity_app:${ELIOT_IDENTITY_DB_PASSWORD}@postgres:5432/${ELIOT_DB_NAME:-eliot_dev}
      ELIOT_DB_STRICT_ACCOUNTS: ${ELIOT_DB_STRICT_ACCOUNTS:-on}
      ELIOT_DB_NAME: ${ELIOT_DB_NAME:-eliot_dev}
      ELIOT_IDENTITY_DB_HOST: postgres
      ELIOT_IDENTITY_DB_PORT: "5432"
      ELIOT_IDENTITY_DB_NAME: ${ELIOT_DB_NAME:-eliot_dev}
      ELIOT_IDENTITY_DB_USER: eliot_identity_app
      ELIOT_IDENTITY_DB_PASSWORD: ${ELIOT_IDENTITY_DB_PASSWORD:?pon la clave de eliot_identity_app}
      ELIOT_FRONTEND_ORIGINS: ${ELIOT_FRONTEND_ORIGINS:?pon el origen de la web}
      ELIOT_FRONTEND_ORIGIN: ${ELIOT_FRONTEND_ORIGIN:?pon el origen de la web}
      ELIOT_OIDC_JWKS_URL: ${ELIOT_OIDC_JWKS_URL:-}
      ELIOT_OIDC_ISSUER: ${ELIOT_OIDC_ISSUER:-}
      ELIOT_OIDC_AUDIENCE: ${ELIOT_OIDC_AUDIENCE:-}
      ELIOT_DEMO_KEY: ${ELIOT_DEMO_KEY:-}
      ELIOT_PORTAL_FEEDS: ${ELIOT_PORTAL_FEEDS:-}
      ELIOT_TELEGRAM_BOT_TOKEN: ${ELIOT_TELEGRAM_BOT_TOKEN:-}
      ELIOT_TELEGRAM_CHAT_ID: ${ELIOT_TELEGRAM_CHAT_ID:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ELIOT_AUTO_PROVISION_USER: ${ELIOT_AUTO_PROVISION_USER:-off}
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_AUTH0_DOMAIN: ${VITE_AUTH0_DOMAIN:-}
        VITE_AUTH0_CLIENT_ID: ${VITE_AUTH0_CLIENT_ID:-}
        VITE_AUTH0_AUDIENCE: ${VITE_AUTH0_AUDIENCE:-}
        VITE_API_ROOT: ${VITE_API_ROOT:-}
    volumes:
      - ./deploy/nginx-vps.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${FACTORIA_HTTP_PORT:-80}:8080"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  factoria_pg:
